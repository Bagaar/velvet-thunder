packages:
  - 'velvet-thunder'
  - 'test-app'
  - 'website'

# test-app gets velvet-thunder as an injected copy (so its peers resolve against
# test-app's ember-source), which needs re-syncing whenever the addon is rebuilt.
syncInjectedDepsAfterScripts:
  - build
overrides:
  '@ember/test-waiters': 4.1.2
  '@glimmer/component': 2.2.1
  postcss: 8.5.32
allowBuilds:
  core-js: false
