<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Website</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    {{content-for "head"}}

    <link rel="icon" href="{{rootURL}}favicon.svg" type="image/svg+xml" />

    <link integrity="" rel="stylesheet" href="{{rootURL}}assets/vendor.css" />
    <link
      integrity=""
      rel="stylesheet"
      href="{{rootURL}}assets/night-owl.min.css"
    />
    <link integrity="" rel="stylesheet" href="{{rootURL}}assets/tailwind.css" />
    <link
      id="theme-default"
      integrity=""
      rel="stylesheet"
      href="{{rootURL}}assets/theme-default.css"
      disabled
    />
    <link
      id="theme-unstyled"
      integrity=""
      rel="stylesheet"
      href="{{rootURL}}assets/theme-unstyled.css"
      disabled
    />
    <link integrity="" rel="stylesheet" href="{{rootURL}}assets/website.css" />

    {{content-for "head-footer"}}

    <script>
      const DARK_MODE_CLASS = "dark";
      const HTML = document.querySelector("html");

      if (
        localStorage.theme === "dark" ||
        (!localStorage.theme &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        HTML.classList.add(DARK_MODE_CLASS);
      } else {
        HTML.classList.remove(DARK_MODE_CLASS);
      }
    </script>

    <script>
      const THEME_LINK_IDS = ["theme-default", "theme-unstyled"];
      const themeName = localStorage.velvetTheme || "default";
      const activeThemeLink = document.getElementById(`theme-${themeName}`);

      THEME_LINK_IDS.forEach((id) => {
        const link = document.getElementById(id);

        if (link) {
          link.disabled = link !== activeThemeLink;
        }
      });
    </script>
  </head>
  <body
    class="antialiased bg-white text-slate-500 dark:bg-slate-900 dark:text-slate-400"
  >
    {{content-for "body"}}

    <script src="{{rootURL}}assets/vendor.js"></script>
    <script src="{{rootURL}}assets/website.js"></script>

    {{content-for "body-footer"}}
  </body>
</html>
